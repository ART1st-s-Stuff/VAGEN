env1:
    env_name: navigation
    env_config:
        render_mode: vision
        prompt_format: grounding_worldmodeling
        use_state_reward: false
        eval_set: base
        max_actions_per_step: 1
        format_reward: 0.02
        invalid_action_penalty: -0.2
        success_threshold: 1.5
    train_size: 10000
    test_size: 64

env2:
    env_name: navigation
    env_config:
        render_mode: vision
        prompt_format: grounding_worldmodeling
        use_state_reward: false
        eval_set: common_sense
        max_actions_per_step: 1
        format_reward: 0.02
        invalid_action_penalty: -0.2
        success_threshold: 1.5
    train_size: 10000
    test_size: 64
